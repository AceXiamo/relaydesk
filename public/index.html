<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>反馈队列 · relaydesk</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9'/%3E%3Cpath d='m8 14 12-7 12 7-12 7zm0 6 12 7 12-7m-24 6 12 7 12-7' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">跳到主内容</a>
    <header class="topbar">
      <button
        class="icon-btn mobile-menu"
        type="button"
        data-nav-toggle
        aria-label="切换侧栏"
        aria-expanded="false"
      >
        <i data-icon="menu"></i>
      </button>
      <a class="brand" href="#queue" aria-label="relaydesk 工作台"
        ><span class="brand-symbol"><i data-icon="layers"></i></span
        >relaydesk</a
      >
      <span class="slash">/</span><span class="workspace-label">工作空间</span>
      <div class="top-right">
        <button class="global-search" type="button" data-quick-search>
          <i data-icon="search"></i><span>搜索任务</span><kbd>⌘ K</kbd></button
        ><span class="user-avatar" aria-label="工作区管理员">ME</span>
        <button class="btn" id="sign-out" type="button" hidden>退出登录</button>
      </div>
    </header>
    <div class="layout">
      <button
        class="scrim"
        type="button"
        data-nav-toggle
        aria-label="收起侧栏"
      ></button>
      <aside class="sidebar" id="sidebar">
        <div class="project-switch">
          <button
            class="project-select"
            type="button"
            id="project-switch"
            aria-expanded="false"
          >
            <span class="project-avatar"><i data-icon="cube"></i></span
            ><span class="project-summary"
              ><strong id="project-name">项目空间</strong
              ><small id="project-repo">选择或创建项目</small></span
            ><i data-icon="chevrons"></i>
          </button>
          <div id="project-menu" class="project-menu" hidden></div>
        </div>
        <nav aria-label="项目导航">
          <p class="nav-group">工作台</p>
          <a href="#queue" data-nav="queue"
            ><i data-icon="inbox"></i>反馈队列
            <span id="nav-count" class="nav-count">0</span></a
          >
          <a href="#mine" data-nav="mine"><i data-icon="user"></i>我负责的</a>
          <a href="#agents" data-nav="agents"
            ><i data-icon="terminal"></i>Agent 处理中</a
          >
          <p class="nav-group">项目管理</p>
          <a href="#sources" data-nav="sources"
            ><i data-icon="plug"></i>收集入口</a
          >
          <a href="#settings" data-nav="settings"
            ><i data-icon="sliders"></i>项目设置</a
          >
        </nav>
        <div class="sidebar-footer">
          <span class="status-led" id="health-led"></span
          ><span id="health-text" role="status">正在连接服务</span
          ><i data-icon="signal"></i>
        </div>
      </aside>
      <main id="main" tabindex="-1" aria-label="项目工作台">
        <div class="loading">正在读取工作区…</div>
      </main>
    </div>
    <dialog id="form-dialog" class="form-dialog"></dialog>
    <dialog id="detail" class="drawer"></dialog>
    <div id="notice" role="status" aria-live="polite" hidden></div>
  </body>
</html>
