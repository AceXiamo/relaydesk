services:
  web:
    image: ghcr.io/acexiamo/relaydesk:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: app.env
    volumes:
      - ./data:/app/data
    networks: [edge]
    labels:
      traefik.enable: "true"
      traefik.http.routers.relaydesk.rule: "Host(`relaydesk.acexiamo.com`)"
      traefik.http.routers.relaydesk.entrypoints: websecure
      traefik.http.routers.relaydesk.tls.certresolver: cf
      traefik.http.services.relaydesk.loadbalancer.server.port: "8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  edge:
    external: true
